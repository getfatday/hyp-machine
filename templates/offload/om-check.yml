name: om-check
on:
  push:
    paths:
      - 'operating-model/**'
      - '!compiled/**'
  pull_request:
    paths:
      - 'operating-model/**'
      - '!compiled/**'
concurrency:
  group: om-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONPATH: .github/om-scripts/pyyaml
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: regenerate catalogue
        run: python3 .github/om-scripts/compile-catalog.py --model-dir operating-model --write
      - name: lint
        run: for d in operating-model/*/; do [ -d "$d" ] || continue; python3 .github/om-scripts/model-lint.py "$d" || exit 1; done
      - name: evaluate
        run: python3 .github/om-scripts/om-worker.py evaluate --root . --plugin-scripts .github/om-scripts
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONPATH: .github/om-scripts/pyyaml
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: compile-check (check mode)
        run: python3 .github/om-scripts/om-worker.py compile-check --root . --plugin-scripts .github/om-scripts
      - name: report staleness
        run: python3 .github/om-scripts/om_check_report_stale.py
      - name: regenerate and commit if stale
        if: ${{ github.actor != 'om-check[bot]' }}
        run: python3 .github/om-scripts/om_check_regen_commit.py
      - name: push regenerated commit if any
        if: ${{ github.actor != 'om-check[bot]' }}
        run: if git symbolic-ref -q HEAD >/dev/null; then git push origin HEAD; else echo "PUSH skipped -- detached HEAD (pull_request checkout)"; fi
